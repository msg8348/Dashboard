name: INIT REAL ESTATE DB (1 YEAR)

on:
  workflow_dispatch:

jobs:
  build-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 1년치 실거래가 데이터 수집 스크립트 작성 및 실행
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          cat << 'EOF' > run_init.py
          import os
          import json
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          import requests

          MOLIT_API_KEY = os.environ.get("MOLIT_API_KEY", "")

          BUSAN_LAWD_CD = {
              "중구": "26110", "서구": "26140", "동구": "26170", "영도구": "26200",
              "부산진구": "26230", "동래구": "26260", "남구": "26290", "북구": "26320",
              "해운대구": "26350", "사하구": "26380", "금정구": "26410", "강서구": "26440",
              "연제구": "26470", "수영구": "26500", "사상구": "26530", "기장군": "26710"
          }

          def fetch_month_data(lawd_cd, deal_ym):
              url = "http://apis.data.go.kr/1613000/RTMSOBJSvc/getRTMSDataSvcAptTradeDev"
              params = {
                  "serviceKey": requests.utils.unquote(MOLIT_API_KEY),
                  "LAWD_CD": lawd_cd,
                  "DEAL_YMD": deal_ym,
                  "pageNo": "1",
                  "numOfRows": "2000"
              }
              trades = []
              try:
                  res = requests.get(url, params=params, timeout=15)
                  if res.status_code == 200:
                      root = ET.fromstring(res.text)
                      for item in root.findall(".//item"):
                          apt_name = (item.findtext("단지", "") or item.findtext("아파트", "")).strip()
                          price_str = item.findtext("거래금액", "0").strip().replace(",", "")
                          price = int(price_str) if price_str.isdigit() else 0
                          area = item.findtext("전용면적", "0").strip()
                          day = item.findtext("일", "0").strip().zfill(2)
                          cancel_day = item.findtext("해제사유발생일", "").strip()
                          
                          if cancel_day:
                              continue

                          if apt_name and price > 0:
                              trades.append({
                                  "apt_name": apt_name,
                                  "area": area,
                                  "price": price,
                                  "deal_ymd": f"{deal_ym}{day}"
                              })
              except Exception as e:
                  print(f"⚠️ 에러 ({lawd_cd}, {deal_ym}): {e}")
              return trades

          def main():
              kst = timezone(timedelta(hours=9))
              now = datetime.now(kst)
              
              months = []
              for i in range(12):
                  year = now.year
                  month = now.month - i
                  while month <= 0:
                      month += 12
                      year -= 1
                  months.append(f"{year}{month:02d}")
                  
              print(f"🚀 최근 1년치 데이터 수집 시작: {months}")
              
              all_trades = []
              high_prices = {}
              
              for ym in months:
                  print(f"📅 {ym} 데이터 수집 중...")
                  for district, lawd_cd in BUSAN_LAWD_CD.items():
                      t_list = fetch_month_data(lawd_cd, ym)
                      for t in t_list:
                          t["district"] = district
                          all_trades.append(t)
                          
                          key = f"{t['apt_name']}_{t['area']}"
                          if t['price'] > high_prices.get(key, 0):
                              high_prices[key] = t['price']

              unique_trades = {f"{t['apt_name']}_{t['area']}_{t['deal_ymd']}_{t['price']}": t for t in all_trades}.values()

              db_data = {
                  "trades": list(unique_trades),
                  "high_prices": high_prices
              }

              os.makedirs("data", exist_ok=True)
              with open("data/real_estate_db.json", "w", encoding="utf-8") as f:
                  json.dump(db_data, f, ensure_ascii=False, indent=2)
                  
              print(f"🎉 1년치 데이터 생성 완료! (총 {len(db_data['trades'])}건)")

          if __name__ == "__main__":
              main()
          EOF
          python run_init.py

      - name: Git 자동 커밋 및 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/real_estate_db.json
          git commit -m "data: 최근 1년치 실거래가 데이터베이스 최초 생성 [skip ci]"
          git push
