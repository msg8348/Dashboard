name: INIT REAL ESTATE DB (1 YEAR)

on:
  workflow_dispatch:

jobs:
  build-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 최근 13개월 실거래 DB 전체 재수집
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          python Dashboard.py --rebuild

      - name: Git 자동 커밋 및 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/real_estate_db.json
          git diff --cached --quiet || (git commit -m "data: 실거래 DB 재수집 [skip ci]" && git push)
