name: SITE PROBE

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "진단할 주소 (공백으로 구분)"
        required: true
        default: "https://asil.kr/app/asil.jsp https://burupang.com"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: 사이트 진단 (저장 없음)
        env:
          URLS: ${{ inputs.urls }}
        run: python tools/site_probe.py $URLS
