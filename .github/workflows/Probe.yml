name: PROBE

# API·공고문 응답 형식 확인용 (수동 실행)
on:
  workflow_dispatch:
    inputs:
      script:
        description: '실행할 확인 스크립트 (notice_probe / permit_probe)'
        default: 'notice_probe'
      args:
        description: '인자 (notice_probe: 청약홈 주택관리번호, permit_probe: "주소" 번 지)'
        default: '2025000415'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pdfplumber
      - env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: python tools/${{ inputs.script }}.py ${{ inputs.args }}
