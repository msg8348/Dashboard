name: DASHBOARD

on:
  schedule:
    # 예약 실행은 '확인 모드': 국토부 새 공개가 있을 때만 전체 수집·배포 (없으면 1분 안에 끝남)
    # 오전엔 매시간 확인(06:13~11:13), 이후 13:23·17:37 한 번 더. 예약 실행이 가끔 누락돼도 다음 확인이 받아 감
    - cron: '13 21,22,23 * * *' # KST 06:13 · 07:13 · 08:13
    - cron: '13 0,1,2 * * *'    # KST 09:13 · 10:13 · 11:13
    - cron: '23 4 * * *'        # KST 13:23
    - cron: '37 8 * * *'        # KST 17:37
  workflow_dispatch:
    inputs:
      fetch:
        description: '국토부 실거래 수집 (끄면 저장된 데이터로 화면만 빠르게 배포)'
        type: boolean
        default: true
      probe:
        description: '확인 모드 (새 공개가 있을 때만 수집·배포) — 외부 예약(Cloudflare)용'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false   # 전국 수집은 오래 걸리므로 진행 중인 실행을 끊지 않고 다음 실행은 기다림

jobs:
  run-bot:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 실거래 저장소 불러오기 (data 브랜치)
        run: |
          mkdir -p store
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git --work-tree=store checkout FETCH_HEAD -- .
            git reset -q
          fi
          du -sh store || true

      - name: 전국 대시보드 생성 (수집 + 페이지)
        id: gen
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          STORE_DIR: store
        run: |
          python national.py --minutes 70 ${{ inputs.fetch == false && '--no-fetch' || '' }} ${{ (github.event_name == 'schedule' || inputs.probe) && '--probe' || '' }}
          if [ -f SKIP_DEPLOY ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: 실거래 저장소 저장 (data 브랜치, 매번 한 커밋으로 교체)
        if: always() && steps.gen.outputs.skip != 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -d store/sale ] || exit 0
          cd store
          rm -rf .git
          git init -q -b data
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -qm "data: 실거래 저장소 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: GitHub Pages 업로드 설정
        if: steps.gen.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: GitHub Pages 배포
        if: steps.gen.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
