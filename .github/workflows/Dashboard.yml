name: DASHBOARD

on:
  schedule:
    # GitHub 예약 실행은 정각에 몰려 지연·누락될 수 있어 정각을 피하고, 누락 대비로 한 번 더 실행
    - cron: '17 19 * * *' # KST 04:17
    - cron: '47 20 * * *' # KST 05:47 (앞 실행이 누락됐을 때 대비, 중복 실행해도 결과 동일)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false   # 전국 수집은 오래 걸리므로 진행 중인 실행을 끊지 않고 다음 실행은 기다림

jobs:
  run-bot:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 실거래 저장소 불러오기 (data 브랜치)
        run: |
          mkdir -p store
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git --work-tree=store checkout FETCH_HEAD -- .
            git reset -q
          fi
          du -sh store || true

      - name: 전국 대시보드 생성 (수집 + 페이지)
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          STORE_DIR: store
        run: |
          python national.py --minutes 70

      - name: 실거래 저장소 저장 (data 브랜치, 매번 한 커밋으로 교체)
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -d store/sale ] || exit 0
          cd store
          rm -rf .git
          git init -q -b data
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -qm "data: 실거래 저장소 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: GitHub Pages 업로드 설정
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
