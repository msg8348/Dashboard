name: DASHBOARD

on:
  schedule:
    - cron: '0 22 * * *' # UTC 22:00 = KST 매일 아침 7시
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  run-bot:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright 캡처용 브라우저 설치
        run: |
          python -m playwright install-deps chromium
          python -m playwright install chromium

      - name: 부동산 HTML 대시보드 리포트 생성
        run: |
          python Dashboard.py

      - name: GitHub Pages 업로드 설정
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
