name: NAVER LISTINGS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = 수영구 일부만 시험 수집 (저장 안 함) / full = 부산 전체 수집"
        required: true
        default: test
        type: choice
        options: [test, full]

permissions:
  contents: write

concurrency:
  group: naver
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 네이버 매물 수집
        run: |
          if [ "${{ inputs.mode || 'full' }}" = "test" ]; then
            python naver.py --test
          else
            python naver.py
          fi

      - name: 수집 결과 저장
        if: ${{ (inputs.mode || 'full') == 'full' }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/naver/state.json
          git diff --cached --quiet || (git commit -m "data: 네이버 매물 갱신 [skip ci]" && git pull --rebase && git push)
