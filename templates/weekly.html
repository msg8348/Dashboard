{% from "_brand.html" import brand, brand_css %}<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간변동률 | 옆집얼마</title>
<meta name="description" content="주간 아파트 매매·전세가격 변동률 — 시도·시군구 지도, 이번 주 많이 오른 곳·내린 곳, 연초 대비 누적 — 한국부동산원 주간 동향 — 옆집얼마">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --ink:#17202c; --ink-2:#4a5566; --muted:#8a94a3; --navy:#2b3a67; --blue:#2754d6; --red:#e0472c; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#eef1f4;color:var(--ink);padding:0 14px 40px;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:600px;margin:0 auto}
{{ brand_css() }}
  .topbar{position:sticky;top:0;z-index:15;background:rgba(238,241,244,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:12px 0 8px;display:flex;align-items:center;justify-content:space-between}
  .menu-btn{width:42px;height:42px;border-radius:12px;border:1px solid #dfe5ea;background:#fff;display:grid;place-items:center;color:var(--ink);cursor:pointer}.menu-btn svg{width:22px;height:22px}
  .head{margin:8px 2px 12px}.head h1{font-size:23px;font-weight:900;letter-spacing:-.4px}
  .tabs{display:flex;background:#e2e6ec;border-radius:14px;padding:4px;margin-bottom:10px}
  .tabs button{flex:1;font:inherit;font-size:15px;font-weight:800;color:var(--ink-2);border:0;background:none;border-radius:11px;padding:10px 0;cursor:pointer}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,30,60,.12)}
  .ctl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
  .seg{display:flex;gap:6px}.seg button{font:inherit;font-size:14px;font-weight:800;padding:8px 16px;border-radius:999px;border:1.5px solid #d6dbe2;background:#fff;color:var(--ink-2);cursor:pointer}
  .seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .ctl select{font:inherit;font-size:14px;font-weight:700;height:38px;border:1px solid #d6dbe2;border-radius:10px;padding:0 10px;background:#fff;color:var(--ink)}
  .ctl select[hidden]{display:none}
  /* 이미지 카드 (샘플과 같은 모양) */
  .card{background:#fff;border:1px solid #e3e8ee;border-radius:20px;padding:18px 18px 12px}
  .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid #e9edf2;margin-bottom:12px}
  .ch .tt{font-size:22px;font-weight:900;letter-spacing:-.4px;line-height:1.25}.ch .st{font-size:13px;font-weight:700;color:var(--ink-2);margin-top:2px}
  .ch .brand{flex:none;display:none}   /* 로고는 저장 이미지에만 */.ch .brand-ic{width:40px;height:30px}.ch .brand-tx b{font-size:19px}.ch .brand-tx small{font-size:9.5px}
  .sum{display:flex;gap:8px;margin-bottom:14px}.sum div{flex:1;border-radius:12px;padding:9px 0;text-align:center}.sum small{display:block;font-size:12.5px;font-weight:800}.sum b{font-size:21px;font-weight:900}
  .maps{display:grid;grid-template-columns:1fr 1.25fr;gap:14px}
  .lbl{font-size:13px;font-weight:800;color:var(--ink-2);margin-bottom:6px}
  .grid{display:grid;gap:4px}.grid.s{grid-template-columns:repeat(4,1fr)}.grid.g{grid-template-columns:repeat(6,1fr);gap:3px}
  .tile{border-radius:10px;padding:7px 2px;text-align:center;min-width:0}.tile b{display:block;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile span{font-size:14px;font-weight:900;letter-spacing:-.3px}
  .grid.g .tile{padding:6px 1px}.grid.g .tile b{font-size:11px}.grid.g .tile span{font-size:12px}
  .legend{display:flex;align-items:center;justify-content:flex-end;gap:3px;font-size:11px;color:var(--muted);font-weight:700;margin-top:8px}.legend i{width:16px;height:9px;border-radius:2px}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  .sec{background:#f6f8fa;border:1px solid #e9edf2;border-radius:14px;padding:10px 12px 6px;min-width:0}
  .sec .chip{display:inline-block;font-size:13px;font-weight:800;color:#fff;border-radius:999px;padding:3px 10px;margin-bottom:4px}
  .r{display:flex;align-items:center;gap:7px;padding:6px 0;border-top:1px solid #eceff3;font-size:14px}
  .r .k{width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:800;display:grid;place-items:center;flex:none;background:#e8ebef;color:var(--ink-2)}
  .r .n{width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}.ytd .r .n{width:120px}
  .r .bar{flex:1;height:8px;background:#e9edf2;border-radius:4px;overflow:hidden}.r .bar i{display:block;height:100%;border-radius:4px}
  .r .v{width:56px;text-align:right;font-weight:800;flex:none}
  .foot{text-align:center;font-size:11px;color:#a3abb7;letter-spacing:.6px;padding-top:10px}
  .empty{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;padding:40px 0}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .btn{background:#fff;color:#111;border:1.5px solid #cfd6de;border-radius:14px;padding:14px;font:inherit;font-size:15px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5}
  /* 전국 지도: 860px 판을 화면 폭에 맞춰 줄여 보여줌 (저장은 원래 크기) */
  .mwrap{position:relative;overflow:hidden}
  .mapc{width:860px;transform-origin:0 0}
  .mapc .ch .tt{font-size:26px}.mapc .ch .st{font-size:13.5px}
  .mapc .sum b{font-size:22px}
  .mg{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:52px;gap:4px}
  .mg .rc{background:#eef1f6;border-radius:12px;margin:-4px;z-index:0}
  .mg .t{position:relative;z-index:1;border-radius:7px;text-align:center;display:flex;flex-direction:column;justify-content:center;min-width:0}
  .mg .t b{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;letter-spacing:-.5px}.mg .t span{font-size:14px;font-weight:900;letter-spacing:-.4px}
  .mg .t.h b{font-size:15px;font-weight:900}.mg .t.h span{font-size:15px}
  @media(max-width:520px){.maps{grid-template-columns:1fr}.two{grid-template-columns:minmax(0,1fr)}.ch .tt{font-size:18px}.ch .brand-tx small{display:none}.ch .brand-ic{width:32px;height:24px}.ch .brand-tx b{font-size:16px}}
</style>
</head>
<body><div class="wrap">
<div class="topbar">{{ brand('index.html') }}<button class="menu-btn" type="button" aria-label="단지 검색" onclick="openSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button></div>
<div class="head"><h1>주간변동률</h1></div>
<div class="tabs" id="tabs"><button type="button" data-t="all" class="on">전국 지도</button><button type="button" data-t="map">지역별</button><button type="button" data-t="rank">오른·내린 곳</button></div>
<div class="ctl"><div class="seg" id="kind"><button type="button" data-k="s" class="on">매매</button><button type="button" data-k="j">전세</button></div><select id="sido" aria-label="시군구를 볼 시도"></select></div>
<div class="card" id="card"><div class="empty">불러오는 중…</div></div>
<div class="acts"><button class="btn" id="shareBtn" type="button">공유하기</button><button class="btn" id="saveBtn" type="button">저장하기</button></div>
</div>
<script>
const W = { t: 'all', k: 's', s: '' };
try { Object.assign(W, JSON.parse(sessionStorage.getItem('ndp_weekly')) || {}); } catch (e) {}
W.t = 'all';   // 들어오면 항상 전국 지도부터 (매매·전세·시도 선택은 기억)
const FVN = (() => { try { const k = localStorage.getItem('ndp_region_fav'); return { '11': '서울', '26': '부산', '27': '대구', '28': '인천', '29': '광주', '30': '대전', '31': '울산', '36': '세종', '41': '경기', '43': '충북', '44': '충남', '46': '전남', '12': '광주', '47': '경북', '48': '경남', '50': '제주', '51': '강원', '52': '전북' }[k] || ''; } catch (e) { return ''; } })();
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KN = { s: '매매', j: '전세' };
const SIDO = [['인천', 0, 0], ['서울', 1, 0], ['경기', 2, 0], ['강원', 3, 0], ['충남', 0, 1], ['세종', 1, 1], ['충북', 2, 1], ['경북', 3, 1], ['전북', 0, 2], ['대전', 1, 2], ['대구', 2, 2], ['울산', 3, 2], ['전남광주', 0, 3, 2], ['경남', 2, 3], ['부산', 3, 3], ['제주', 0, 4]];
const SEOUL = { 강북구: [3, 0], 도봉구: [4, 0], 노원구: [5, 0], 은평구: [1, 1], 종로구: [2, 1], 성북구: [3, 1], 동대문구: [4, 1], 중랑구: [5, 1], 서대문구: [1, 2], 중구: [2, 2], 성동구: [3, 2], 광진구: [4, 2], 강동구: [5, 2], 강서구: [0, 3], 마포구: [1, 3], 용산구: [2, 3], 서초구: [3, 3], 강남구: [4, 3], 송파구: [5, 3], 양천구: [0, 4], 영등포구: [1, 4], 동작구: [2, 4], 관악구: [3, 4], 구로구: [0, 5], 금천구: [1, 5] };
function col(v) {   // 오르면 빨강, 내리면 파랑 (클수록 진하게)
  if (v == null) return ['#f2f4f7', '#a3abb7'];
  if (v > 0) { const a = Math.min(1, v / 0.45); return [`rgba(224,71,44,${(0.12 + 0.78 * a).toFixed(2)})`, a > 0.45 ? '#fff' : '#8a2412']; }
  if (v < 0) { const a = Math.min(1, -v / 0.35); return [`rgba(39,84,214,${(0.12 + 0.78 * a).toFixed(2)})`, a > 0.45 ? '#fff' : '#1d3f9e']; }
  return ['#eef1f5', '#4a5566'];
}
const sg = v => v == null ? '-' : (v > 0 ? '+' : v < 0 ? '' : '') + v.toFixed(2);
const tile = (n, v, c, r, sp) => { const [bg, fg] = col(v); return `<div class="tile" style="background:${bg};color:${fg}${c != null ? `;grid-column:${c + 1}${sp ? ` / span ${sp}` : ''};grid-row:${r + 1}` : ''}"><b>${esc(n)}</b><span>${sg(v)}</span></div>`; };
const tdate = t => {   // 시점 'YYYYWW'(ISO 주) → 그 주 월요일 '26.11.16'
  t = String(t || ''); let m = t.match(/^(\d{4})(\d{2})(\d{2})$/);
  if (m) return `${m[1].slice(2)}.${m[2]}.${m[3]}`;
  m = t.match(/^(\d{4})(\d{2})$/); if (!m) return t;
  const jan4 = new Date(Date.UTC(+m[1], 0, 4)), mon = new Date(jan4.getTime() - ((jan4.getUTCDay() + 6) % 7) * 864e5 + (+m[2] - 1) * 7 * 864e5);
  return `${String(mon.getUTCFullYear()).slice(2)}.${String(mon.getUTCMonth() + 1).padStart(2, '0')}.${String(mon.getUTCDate()).padStart(2, '0')}`;
};
let D = null;
async function render() {
  try { sessionStorage.setItem('ndp_weekly', JSON.stringify(W)); } catch (e) {}
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === W.t));
  document.querySelectorAll('#kind button').forEach(b => b.classList.toggle('on', b.dataset.k === W.k));
  D = D || await fetch('weekly.json?v={{ today }}').then(r => r.ok ? r.json() : {}).catch(() => ({}));
  const d = D[W.k], card = document.getElementById('card'), sel = document.getElementById('sido');
  sel.hidden = W.t !== 'map';
  document.getElementById('card').classList.toggle('wide', W.t === 'all');
  if (!d || !d.sido) {
    card.innerHTML = `<div class="empty">${KN[W.k]} 주간변동률 준비 중이에요<br><small>한국부동산원 주간 아파트 동향 · 매주 목요일 갱신</small></div>`;
    document.querySelectorAll('.acts .btn').forEach(b => { b.disabled = true; }); return;
  }
  document.querySelectorAll('.acts .btn').forEach(b => { b.disabled = false; });
  const subs = Object.keys(d.sub || {});
  if (!subs.includes(W.s)) W.s = subs.includes(FVN) ? FVN : subs.includes('서울') ? '서울' : subs[0] || '';
  sel.innerHTML = subs.map(s => `<option${s === W.s ? ' selected' : ''}>${esc(s)}</option>`).join('');
  const brand = document.querySelector('.topbar .brand').outerHTML;
  const head = (t, s) => `<div class="ch"><div><div class="tt">${t}</div><div class="st">${s}</div></div>${brand}</div>`;
  const foot = '<div class="foot">nextdoorprice.com · 한국부동산원 주간 아파트 동향</div>';
  if (W.t === 'all') {
    const nat = ['전국', '수도권', '지방'].map(n => { const v = d.nat[n], [bg, fg] = col(v); return `<div style="background:${bg};color:${fg}"><small>${n}</small><b>${sg(v)}%</b></div>`; }).join('');
    card.innerHTML = `<div class="mwrap"><div class="mapc" id="mapc">` + head(`주간 아파트 ${KN[W.k]}가격 변동률`, `${tdate(d.t)} 기준 · 전주 대비 % · 한국부동산원`)
      + `<div class="sum">${nat}</div>${allMap(d)}`
      + `<div class="legend">하락${[-.35, -.15, -.04, 0, .04, .15, .4].map(v => `<i style="background:${col(v)[0]}"></i>`).join('')}상승</div>` + foot + `</div></div>`;
    fitMap();
  } else if (W.t === 'map') {
    const nat = ['전국', '수도권', '지방'].map(n => { const v = d.nat[n], [bg, fg] = col(v); return `<div style="background:${bg};color:${fg}"><small>${n}</small><b>${sg(v)}%</b></div>`; }).join('');
    const rows = d.sub[W.s] || [];
    const isSeoul = W.s === '서울';
    const right = `<div><div class="lbl">${esc(W.s)} ${rows.length}개 시군구</div><div class="grid g">${rows.map(([n, v]) => isSeoul && SEOUL[n] ? tile(n.length > 2 ? n.replace(/구$/, '') : n, v, SEOUL[n][0], SEOUL[n][1]) : tile(n, v)).join('')}</div></div>`;
    card.innerHTML = head(`주간 아파트 ${KN[W.k]}가격 변동률`, `${tdate(d.t)} 기준 · 전주 대비 %`)
      + `<div class="sum">${nat}</div><div class="maps"><div><div class="lbl">시도</div><div class="grid s">${SIDO.map(([n, c, r, sp]) => tile(n, d.sido[n], c, r, sp)).join('')}</div></div>${right}</div>`
      + `<div class="legend">하락${[-.35, -.15, -.04, 0, .04, .15, .4].map(v => `<i style="background:${col(v)[0]}"></i>`).join('')}상승</div>` + foot;
  } else {
    const lst = (t, rows, c, suf, cls) => { const mx = Math.max(...rows.map(r => Math.abs(r[1])), 0.01);
      return `<div class="sec ${cls || ''}"><span class="chip" style="background:${c}">${t}</span>${rows.map(([n, v], i) => `<div class="r"><span class="k" style="${i < 3 ? `background:${c};color:#fff` : ''}">${i + 1}</span><b class="n">${esc(n)}</b><span class="bar"><i style="width:${(Math.abs(v) / mx * 100).toFixed(0)}%;background:${c}"></i></span><b class="v" style="color:${c}">${sg(v)}${suf || ''}</b></div>`).join('')}</div>`; };
    card.innerHTML = head('이번 주 많이 오른 곳 · 내린 곳', `${tdate(d.t)} 기준 · 아파트 ${KN[W.k]}가격 변동률 %`)
      + `<div class="two">${lst('상승 Top 10', d.up || [], '#e0472c')}${lst('하락 Top 10', d.dn || [], '#2754d6')}</div>`
      + `<div style="margin-top:8px">${lst('연초 대비 누적 상승 Top 5', d.ytd || [], '#c2410c', '%', 'ytd')}</div>` + foot;
  }
}
// ── 전국 지도 (지도 모양 배치: 12칸 × 행, 시도마다 연한 바탕 · 첫 칸은 시도) ──
const SE_POS = [['은평구', '서대문구', '종로구', '성북구', '강북구'], ['마포구', '중구', '동대문구', '도봉구', '노원구'], ['강서구', '용산구', '성동구', '중랑구', '광진구'], ['양천구', '영등포구', '동작구', null, '강동구'], ['구로구', '금천구', '관악구', '서초구', '강남구']];
const GG = { west: ['파주', '김포', '고양 일산서구', '고양 일산동구', '고양 덕양구', '부천 오정구', '부천 원미구', '부천 소사구', '광명', '시흥', '안산 단원구', '안산 상록구', '군포', '의왕', '과천', '안양 만안구'],
  north: ['동두천', '양주', '의정부', '포천'], east: ['남양주', '구리', '하남', '성남 수정구', '성남 중원구', '성남 분당구', '광주', '용인 수지구', '이천', '용인 기흥구', '용인 처인구', '여주'],
  south: ['안양 동안구', '수원 장안구', '수원 팔달구', '수원 권선구', '수원 영통구', '화성 효행구', '화성 병점구', '화성 동탄구', '화성 만세구', '오산', '평택', '안성'] };
const BLOCKS = [['충남', 0, 9, 4, 3], ['세종', 4, 9, 1, 1], ['대전', 4, 10, 2, 3], ['충북', 6, 9, 3, 3], ['강원', 9, 9, 3, 3], ['전북', 0, 12, 3, 3], ['경북', 7, 12, 5, 3], ['대구', 5, 15, 3, 3], ['울산', 9, 15, 3, 2],
  ['전남광주', 0, 15, 4, 3], ['경남', 4, 18, 5, 3], ['부산', 9, 17, 3, 6], ['제주', 0, 20, 3, 1]];
const shortN = a => { a = String(a).split(' ').pop(); a = a.length > 2 ? a.replace(/(구|군)$/, '') : a; return { 마산합포: '합포', 마산회원: '회원' }[a] || a; };
function allMap(d) {
  const sub = {}; Object.entries(d.sub || {}).forEach(([k, v]) => { sub[k] = {}; v.forEach(([n, x]) => { sub[k][n] = x; sub[k][shortN(n)] = sub[k][shortN(n)] ?? x; }); });
  const rects = [], tiles = [];
  const T = (sd, name, c, r, head) => tiles.push([head ? sd : shortN(name), head ? d.sido[sd] : (sub[sd] || {})[name] ?? (sub[sd] || {})[shortN(name)], c, r, head]);
  const block = (sd, c0, r0, w, h, order) => {
    const names = order || (d.sub[sd] || []).map(x => x[0]);
    rects.push([c0, r0, w, h]);
    const cells = Array.from({ length: w * h }, (_, i) => [c0 + i % w, r0 + Math.floor(i / w)]);
    T(sd, sd, ...cells[0], true);
    names.slice(0, cells.length - 1).forEach((n, i) => T(sd, n, ...cells[i + 1]));
  };
  rects.push([4, 1, 5, 6]);
  SE_POS.forEach((row, ri) => row.forEach((n, ci) => { if (n) T('서울', n, 4 + ci, 1 + ri); }));
  T('서울', '서울', 7, 4, true); T('서울', '송파구', 8, 6);
  rects.push([2, 0, 2, 8]); GG.west.forEach((n, i) => T('경기', n, 2 + i % 2, Math.floor(i / 2)));
  rects.push([4, 0, 5, 1]); T('경기', '경기', 4, 0, true); GG.north.forEach((n, i) => T('경기', n, 5 + i, 0));
  rects.push([9, 1, 3, 6]); GG.east.forEach((n, i) => T('경기', n, 9 + i % 3, 1 + Math.floor(i / 3)));
  rects.push([4, 7, 8, 2]); GG.south.forEach((n, i) => T('경기', n, 4 + (i < 6 ? i : i - 6), 7 + (i >= 6 ? 1 : 0)));
  block('인천', 0, 2, 2, 5, ['검단구', '계양구', '서해구', '부평구', '영종구', '미추홀구', '남동구', '제물포구', '연수구']);
  BLOCKS.forEach(b => block(...b));
  return `<div class="mg">` + rects.map(([c, r, w, h]) => `<i class="rc" style="grid-column:${c + 1}/span ${w};grid-row:${r + 1}/span ${h}"></i>`).join('')
    + tiles.map(([n, v, c, r, hd]) => { const [bg, fg] = hd ? ['#2b3a67', '#fff'] : col(v); return `<div class="t${hd ? ' h' : ''}" style="grid-column:${c + 1};grid-row:${r + 1};background:${bg};color:${fg}"><b>${esc(n)}</b><span>${sg(v)}</span></div>`; }).join('') + `</div>`;
}
function fitMap() {
  const m = document.getElementById('mapc'); if (!m) return;
  const w = m.parentElement.clientWidth, sc = Math.min(1, w / 860);

}
window.addEventListener('resize', fitMap);
document.getElementById('tabs').onclick = e => { const b = e.target.closest('button'); if (b) { W.t = b.dataset.t; render(); } };
document.getElementById('kind').onclick = e => { const b = e.target.closest('button'); if (b) { W.k = b.dataset.k; render(); } };
document.getElementById('sido').onchange = e => { W.s = e.target.value; render(); };
render();
// ── 이미지 공유·저장 (카드 그대로, 가로 540px) ──
const loadH2C = () => window.html2canvas ? Promise.resolve() : new Promise((ok, no) => {
  const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc);
});
async function makeImage() {
  await loadH2C();
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const canvas = await html2canvas(document.getElementById('card'), { scale: 2, backgroundColor: '#ffffff', useCORS: true, windowWidth: W.t === 'all' ? 960 : 600, scrollX: 0, scrollY: -window.scrollY,
    onclone: doc => { const c = doc.getElementById('card'); c.querySelectorAll('.ch .brand').forEach(x => { x.style.display = 'inline-flex'; }); Object.assign(c.style, { width: W.t === 'all' ? '896px' : '540px', border: '0', borderRadius: '0' });
      const m = c.querySelector('#mapc'); if (m) { m.style.transform = 'none'; m.parentElement.style.height = 'auto'; }
      c.querySelectorAll('.maps').forEach(x => { x.style.gridTemplateColumns = '1fr 1.25fr'; }); c.querySelectorAll('.two').forEach(x => { x.style.gridTemplateColumns = 'minmax(0,1fr) minmax(0,1fr)'; }); } });
  const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
  return new File([blob], `주간변동률_${KN[W.k]}_${W.t === 'all' ? '전국지도' : W.t === 'map' ? W.s : '순위'}.png`, { type: 'image/png' });
}
async function act(kind) {
  const btns = [...document.querySelectorAll('.acts .btn')], lb = btns.map(b => b.textContent);
  btns.forEach(b => { b.disabled = true; }); (kind === 'share' ? btns[0] : btns[1]).textContent = '준비 중…';
  try {
    const f = await makeImage();
    const dl = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); };
    if (kind === 'share' && navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f] }).catch(() => {});
    else if (kind === 'share' && navigator.share) await navigator.share({ title: document.title, url: location.href }).catch(() => {});
    else dl();
  } catch (e) { alert('이미지를 만들지 못했어요'); }
  btns.forEach((b, i) => { b.disabled = false; b.textContent = lb[i]; });
}
document.getElementById('shareBtn').onclick = () => act('share');
document.getElementById('saveBtn').onclick = () => act('save');
